name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    uses: ./.github/workflows/ui-tests.yml

  build:
    needs: ui-tests
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore tests/NineFlow.Tests/NineFlow.Tests.csproj

      - name: 编译
        run: dotnet build tests/NineFlow.Tests/NineFlow.Tests.csproj -c Release --no-restore

      - name: 运行逻辑测试
        run: dotnet tests/NineFlow.Tests/bin/Release/net10.0-windows/NineFlow.Tests.dll --skip-integration

      - name: 发布单文件 exe
        run: dotnet publish src/NineFlow.Wpf/NineFlow.Wpf.csproj -c Release -o publish

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v7
        with:
          name: NineFlow-exe
          path: publish/NineFlow.exe
          if-no-files-found: error