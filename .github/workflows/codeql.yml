name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: 编译
        run: dotnet build src/NineFlow.Wpf/NineFlow.Wpf.csproj -c Release

      - name: 安全分析
        uses: github/codeql-action/analyze@v4
